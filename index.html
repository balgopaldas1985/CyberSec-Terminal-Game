<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERSEC // MAINFRAME TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #020617;
            color: #00ff66;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .header {
            border-bottom: 1px solid #00ff66;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
        }

        .status {
            font-size: 0.85rem;
            color: #ff5555;
        }

        .terminal-screen {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 6px;
            margin: 15px 0;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: #090d16;
            padding: 10px;
            border: 1px solid #00ff66;
            border-radius: 6px;
        }

        .prompt-symbol {
            color: #00ff66;
            font-weight: bold;
        }

        input[type="text"] {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
        }

        .btn-send {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-send:hover {
            opacity: 0.8;
        }

        .success { color: #00ff66; font-weight: bold; }
        .error { color: #ff5555; }
        .info { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">[SYS_SEC // SECURE TERMINAL v4.2]</div>
        <div class="status" id="secStatus">SECURITY: LOCKED DOWN</div>
    </div>

    <div class="terminal-screen" id="terminalOutput">
        Initializing Secure Uplink...<br>
        Connection established to Target Gateway: 192.168.1.105<br>
        Type <span class="info">'help'</span> to see available breach commands.<br><br>
    </div>

    <div class="input-group">
        <span class="prompt-symbol">root@cyber:~#</span>
        <input type="text" id="commandInput" placeholder="Type command here (e.g., help)..." autofocus />
        <button class="btn-send" onclick="executeCommand()">EXECUTE</button>
    </div>

    <script>
        const inputField = document.getElementById('commandInput');
        const outputScreen = document.getElementById('terminalOutput');
        const secStatus = document.getElementById('secStatus');

        let currentMission = 0;

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeCommand();
            }
        });

        function printToTerminal(text, className = '') {
            outputScreen.innerHTML += `<div class="${className}">${text}</div>`;
            outputScreen.scrollTop = outputScreen.scrollHeight;
        }

        function executeCommand() {
            const cmd = inputField.value.trim().toLowerCase();
            if (!cmd) return;

            printToTerminal(`root@cyber:~# ${cmd}`);
            inputField.value = '';

            if (cmd === 'help') {
                printToTerminal("AVAILABLE COMMANDS:", "info");
                printToTerminal("  - help: Displays this manual");
                printToTerminal("  - scan: Scans target network nodes");
                printToTerminal("  - breach: Initiates firewall bypass protocol");
                printToTerminal("  - clear: Clears the terminal screen");
            } 
            else if (cmd === 'clear') {
                outputScreen.innerHTML = '';
            }
            else if (cmd === 'scan') {
                printToTerminal("[*] Scanning local subnet...", "info");
                printToTerminal("[+] Node 1: Gateway Firewall [LOCKED]");
                printToTerminal("[+] Node 2: Central Database [SECURE]");
                printToTerminal("Type 'breach' to target Node 1.");
            }
            else if (cmd === 'breach') {
                currentMission = 1;
                printToTerminal("[!] Initiating brute-force decryption on Firewall...", "error");
                printToTerminal("[?] SECURITY CHALLENGE 1: What is the solution to 15 * 4 + 10?", "info");
                printToTerminal("Type your answer directly as a command (e.g., '70').");
            }
            else if (currentMission === 1) {
                if (cmd === '70') {
                    currentMission = 2;
                    printToTerminal("[SUCCESS] Firewall node 1 bypassed!", "success");
                    printToTerminal("[?] SECURITY CHALLENGE 2: Who proposed the Theory of Relativity? (type last name)", "info");
                } else {
                    printToTerminal("[ACCESS DENIED] Incorrect passcode. Try again.", "error");
                }
            }
            else if (currentMission === 2) {
                if (cmd === 'einstein') {
                    currentMission = 3;
                    printToTerminal("[SUCCESS] Database encryption bypassed!", "success");
                    printToTerminal("[?] SECURITY CHALLENGE 3: What is the chemical symbol for Gold?", "info");
                } else {
                    printToTerminal("[ACCESS DENIED] Incorrect answer.", "error");
                }
            }
            else if (currentMission === 3) {
                if (cmd === 'au') {
                    currentMission = 0;
                    secStatus.innerText = "MAINFRAME COMPROMISED [ACCESS GRANTED]";
                    secStatus.style.color = "#00ff66";
                    printToTerminal("[+] ACCESS GRANTED. Welcome to the core mainframe database, Agent.", "success");
                    printToTerminal("[+] Mission Accomplished! Type 'scan' to replay.", "info");
                } else {
                    printToTerminal("[ACCESS DENIED] Incorrect chemical symbol.", "error");
                }
            }
            else {
                printToTerminal(`Command not recognized: '${cmd}'. Type 'help' for options.`, "error");
            }
        }
    </script>
</body>
  </html>
